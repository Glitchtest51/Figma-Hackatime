<html>
    <head>
        <title>HackaTime Config</title>
        <style>
            body {
                background-color: var(--figma-color-bg);
                color: var(--figma-color-text);
                font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                min-width: 400px;
                max-width: 400px;
                min-height: 300px;
                margin: 0;
                font-size: 75%;
            }

            label {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: .5rem .25rem;
            }

            input {
                height: 3rem;
                padding: 0rem 1rem;
                font-size: 1rem;
                border-radius: .5rem;
                border-color: transparent;
                background-color: var(--figma-color-bg-brand-tertiary);
                width: 100%;
                color: inherit;
                outline: 2px solid var(--figma-color-border-brand);
            }

            input:focus, input:focus-within {
                box-shadow: none;

                outline-color: var(--figma-color-border-selected);
            }

            .app {
                padding: 1.5rem;
                gap: 0.75rem;
                flex-direction: column;
                display: flex;
            }

            .title {
                font-weight: 600;
                line-height: 2rem;
                margin: 0;
            }

            .status {
                border-radius: 1rem;
                padding: 1.25rem;
            }

            .loading { background-color: transparent; outline: 0.125rem solid var(--figma-color-border-brand); }
            .success { background-color: var(--figma-color-bg-success) }
            .fail { background-color: var(--figma-color-bg-danger-secondary) }

            .status-text {
                font-size: 1rem;
                line-height: 1.5rem;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div class="app">
            <h1 class="title" style="font-size: 1.5rem;">HackaTime for Figma</h1>
            <div class="status loading">
                <h2 class="title">Initializing...</h2>
                <p class="status-text">Waiting for config...</p>
            </div>
            <form id="api">
                <label for="apiKey">API Key</label>
                <input type="password" id="apiKey" name="apiKey"><br><br>
                <label for="apiURL">API URL</label>
                <input type="text" id="apiURL" name="apiURL"><br><br>
            </form>
        </div>

        <script>
            onmessage = (event) => {
                switch (event.data.pluginMessage.type) {
                    case "apiData": {
                        let { apiKey, apiURL } = event.data.pluginMessage;
                        document.getElementById("apiKey").value = apiKey ?? "";
                        document.getElementById("apiURL").value = apiURL ?? "";
                        break;
                    }
                    
                    case "apiOK": {
                        const statusContainer = document.querySelector('.status');
                        const statusTitle = document.querySelector('.status .title');
                        const statusText = document.querySelector('.status .status-text');
                        statusContainer.classList.remove('loading', 'fail', 'success');
                        statusContainer.classList.add('success');
                        statusTitle.textContent = "Good to go!";
                        statusText.textContent = "API key and URL are valid!";
                    }

                    case "apiError": {
                        const statusContainer = document.querySelector('.status');
                        const statusTitle = document.querySelector('.status .title');
                        const statusText = document.querySelector('.status .status-text');

                        let { reason, status } = event.data.pluginMessage;
                        switch (reason) {
                            case "invalid_credentials": {
                                statusContainer.classList.remove('loading', 'fail', 'success');
                                statusContainer.classList.add('fail');
                                statusTitle.textContent = "Failed";
                                statusText.textContent = "Invalid API key.";
                                return;
                            }

                            case "api_error": {
                                statusContainer.classList.remove('loading', 'fail', 'success');
                                statusContainer.classList.add('fail');
                                statusTitle.textContent = "Failed";
                                statusText.textContent = `API Error. Status : ${status}`;
                                return;
                            }

                            case "network_error": {
                                statusContainer.classList.remove('loading', 'fail', 'success');
                                statusContainer.classList.add('fail');
                                statusTitle.textContent = "Failed";
                                statusText.textContent = "Network error, please check your internet connection, URL may be invalid, CORS must be supported.";
                                return;
                            }

                            case "invalid_url": {
                                statusContainer.classList.remove('loading', 'fail', 'success');
                                statusContainer.classList.add('fail');
                                statusTitle.textContent = "Failed";
                                statusText.textContent = "Invalid URL, please check your URL";
                                return;
                            }

                            case "missing_both": {
                                statusContainer.classList.remove('loading', 'fail', 'success');
                                statusContainer.classList.add('loading');
                                statusTitle.textContent = "Initializing...";
                                statusText.textContent = "Waiting for config... Missing API URL and API Key";
                                return;
                            }

                            case "missing_url": {
                                statusContainer.classList.remove('loading', 'fail', 'success');
                                statusContainer.classList.add('loading');
                                statusTitle.textContent = "Initializing...";
                                statusText.textContent = "Waiting for config... Missing API URL";
                                return;
                            }

                            case "missing_key": {
                                statusContainer.classList.remove('loading', 'fail', 'success');
                                statusContainer.classList.add('loading');
                                statusTitle.textContent = "Initializing...";
                                statusText.textContent = "Waiting for config... Missing API Key";
                                return;
                            }
                        }
                        break;
                    }
                }
            }

            document.getElementById('api').addEventListener('input', function(event) {
                event.preventDefault();
                parent.postMessage({
                    pluginMessage: {
                        type: "settings",
                        apiKey: document.getElementById("apiKey").value,
                        apiURL: document.getElementById("apiURL").value
                    }
                }, "*");
            });
        </script>
    </body>
</html>
